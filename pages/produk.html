<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk MPM | Motivator Pembangunan Masyarakat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1B6B2F', dark: '#145224', light: '#E8F5E9' },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-gray-800 bg-gray-50 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <!-- Breadcrumb -->
  <div class="bg-gray-100 py-4 border-b border-gray-200">
    <div class="container mx-auto px-4 lg:px-8 max-w-7xl">
      <nav class="flex text-sm text-gray-500">
        <a href="../index.html" class="hover:text-primary transition-colors">Beranda</a>
        <span class="mx-2">/</span>
        <span class="text-gray-900 font-medium">Produk</span>
      </nav>
    </div>
  </div>

  <main class="flex-grow py-12">
    <div class="container mx-auto px-4 lg:px-8 max-w-7xl">
      <h1 class="text-3xl font-bold text-gray-900 mb-8 border-b-4 border-primary inline-block pb-2">Katalog Produk</h1>
      
      <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Products injected here -->
      </div>
    </div>
  </main>

  <!-- Cart Sidebar/Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl transform translate-x-full transition-transform duration-300 flex flex-col" id="cartContent">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h2 class="text-lg font-bold text-gray-900">Keranjang Belanja</h2>
        <button id="closeCartBtn" class="text-gray-500 hover:text-red-500" aria-label="Tutup Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="cartItems" class="flex-grow p-4 overflow-y-auto space-y-4">
        <!-- Cart items go here -->
        <p class="text-gray-500 text-center mt-10">Keranjang masih kosong.</p>
      </div>
      <div class="p-4 border-t border-gray-100 bg-gray-50">
        <div class="flex justify-between items-center mb-4">
          <span class="font-bold text-gray-700">Total:</span>
          <span id="cartTotal" class="font-bold text-primary text-xl">Rp 0</span>
        </div>
        <button id="checkoutBtn" class="w-full btn bg-[#25D366] hover:bg-[#128C7E] text-white flex justify-center items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Checkout via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/footer.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/produk.js"></script>
</body>
</html>
