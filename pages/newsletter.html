<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Baca newsletter Yayasan Motivator Pembangunan Masyarakat.">
  <title>Newsletter - Yayasan MPM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1B6B2F', dark: '#145224', light: '#E8F5E9' },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-gray-800 bg-gray-50 flex flex-col min-h-screen">
  <div id="site-header"></div>

  <div class="bg-gray-100 py-4 border-b border-gray-200">
    <div class="container mx-auto px-4 lg:px-8 max-w-7xl">
      <nav class="flex text-sm text-gray-500" aria-label="Breadcrumb">
        <a href="../index.html" class="hover:text-primary transition-colors">Beranda</a>
        <span class="mx-2">/</span>
        <a href="publikasi.html" class="hover:text-primary transition-colors">Publikasi</a>
        <span class="mx-2">/</span>
        <span data-newsletter-month class="text-gray-900 font-medium">Newsletter</span>
      </nav>
    </div>
  </div>

  <main class="flex-grow py-12">
    <div class="container mx-auto px-4 lg:px-8 max-w-7xl">
      <article class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-gray-100">
        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_20rem] gap-10 items-start">
          <div>
            <p data-newsletter-month class="text-sm font-semibold text-primary mb-3">Edisi newsletter</p>
            <h1 data-newsletter-title class="text-3xl md:text-4xl font-bold text-gray-900 mb-6 leading-tight">Newsletter</h1>
            <p data-newsletter-summary class="text-lg text-gray-600 mb-6"></p>
            <div data-newsletter-draft-notice class="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4 text-sm" role="note">
              Draf editorial untuk pratinjau. Isi ini bukan laporan kegiatan resmi dan perlu disesuaikan dengan materi newsletter yang telah diverifikasi.
            </div>
          </div>
          <img data-newsletter-cover src="" alt="" class="publication-detail-cover rounded-xl shadow-md mx-auto lg:mx-0">
        </div>

        <div data-newsletter-article class="prose prose-lg max-w-none text-gray-600 space-y-6 mt-10 blog-article-content"></div>
        <a href="publikasi.html" class="btn btn-outline mt-10">Kembali ke Publikasi</a>
      </article>
      <section data-newsletter-engagement class="blog-engagement" hidden></section>
      <section aria-labelledby="related-publications-title" class="space-y-8">
        <h2 id="related-publications-title" class="text-3xl font-bold text-gray-900">Publikasi lainnya</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" data-newsletter-related></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <button id="scrollTopBtn" aria-label="Gulir ke atas">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
  </button>

  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/footer.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/publications.js"></script>
  <script src="../assets/js/blog-data.js"></script>
</body>
</html>
