<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F6B3A">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png">
  <title>MPM sedang offline</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8f5; color: #173b25; }
    main { width: min(90vw, 30rem); padding: 2rem; text-align: center; }
    img { width: 112px; height: 112px; object-fit: contain; border-radius: 24px; margin-bottom: 1rem; }
    h1 { color: #1F6B3A; margin: 0 0 .75rem; }
    p { line-height: 1.6; margin: .5rem 0; }
    button { margin-top: 1rem; border: 0; border-radius: 999px; padding: .8rem 1.25rem; background: #1F6B3A; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="./assets/icons/icon-192.png" alt="Logo MPM">
    <h1>MPM sedang offline</h1>
    <p>Halaman ini belum tersedia di perangkat saat ini.</p>
    <p>Periksa koneksi internet, lalu coba lagi. Pengiriman formulir, rating, komentar, dan transaksi tidak dilakukan ketika offline.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
